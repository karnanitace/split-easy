[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spliteasy"
version = "0.1.0"
description = "Track shared group expenses and settle up with the minimum number of payments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.5",
]

[project.scripts]
spliteasy = "spliteasy.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spliteasy"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
